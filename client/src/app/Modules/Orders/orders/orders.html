<div class="order-main relative p-8">
    <div *ngIf="orders.length > 0" class="order-list flex flex-row flex-wrap gap-8">
        <div *ngFor="let order of orders" class="mt-10 flex flex-row flex-wrap gap-8 relative">
            <div *ngFor="let list of order.orders" class="order-card border-2 gap-8 w-[250px] h-[350px] border-gray-300 rounded-lg p-4 bg-white relative">
            <span class="quantity absolute right-0 top-0 h-[35px] w-[35px] rounded-full text-white bg-black flex items-center justify-center">{{list.count}}</span>
                <img [src]="list.url" alt="{{ list.title }}" class="w-[250px] h-[200px] object-cover mb-4 rounded">
                <h2 class="text-xl font-semibold mb-2">{{ list.title }}</h2>
                <p class="text-gray-600 mb-2">Author: {{ list.author }}</p>
                <div class="dtls flex justify-between items-center">
                    <p class="text-gray-800 font-bold">Price: {{ list.price }}</p>
                    <span class="px-1 py-2 text-black rounded-md cursor-pointer text-wrap font-semibold">{{order.getDateTime.toString().substring(0,10)}}</span>
                </div>
            </div>
        </div>
    </div>
    <h2 *ngIf="orders.length === 0" class="text-2xl font-semibold text-gray-600 text-center mt-20">Your Have No Orders</h2>
</div>
