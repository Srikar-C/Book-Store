<div class="book-main relative ">
    <button *ngIf = "kindOfUser!='admin'" type="button" class="px-4 py-2 fixed right-6 bottom-3 bg-blue-600 text-white rounded-md hover:bg-blue-700 cursor-pointer" (click)="checkOut()">Checkout</button>
    <div class="book-list flex flex-row gap-8 flex-wrap p-8">
        <div *ngFor="let book of books" class="mt-10 book-card border-2 w-[250px] h-[350px] border-gray-300 rounded-lg p-4 bg-white relative">
            <span class="quantity absolute right-0 top-0 h-[35px] w-[35px] rounded-full text-white bg-black flex items-center justify-center">{{book.quantity}}</span>
            <img [src]="book.url" alt="{{ book.title }}" class="w-[300px] h-[200px] object-cover mb-4 rounded">
            <h2 class="text-xl font-semibold mb-2">{{ book.title }}</h2>
            <p class="text-gray-600 mb-2">Author: {{ book.author }}</p>
            <div class="dtls flex relative items-center">
                <p class="text-gray-800 font-bold">Price: {{ book.price }}</p>
                <button *ngIf = "kindOfUser=='admin'" type="button" class="px-4 py-2 absolute right-0 bottom-0 mb-[-7px] bg-blue-600 text-white rounded-md hover:bg-blue-700 cursor-pointer" (click)="editBook(book)">Edit</button>
                <button *ngIf = "kindOfUser!='admin' && book.selected==false" type="button" class="px-4 py-2 absolute right-0 bottom-0 mb-[-7px] bg-blue-600 text-white rounded-md hover:bg-blue-700 cursor-pointer" (click)="addToCart(book)">Add Cart</button>
                <div *ngIf = "kindOfUser!='admin' && book.selected==true" class="numcart absolute right-1 bottom-0 mb-[-7px] gap-1 flex items-center rounded-lg w-[110px] h-[40px] border-2 border-blue-600">
                    <span class="minus rounded-l-lg text-white p-3 cursor-pointer bg-blue-600" (click)="decrement(book)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-dash-circle" viewBox="0 0 16 16">
                            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                            <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8"/>
                        </svg>
                    </span>
                    <p class="number w-[50px] text-center">{{book.count}}</p> 
                    <span class="plus rounded-r-lg text-white p-3 cursor-pointer bg-blue-600" (click)="increment(book)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-circle-dotted" viewBox="0 0 16 16">
                            <path d="M8 0q-.264 0-.523.017l.064.998a7 7 0 0 1 .918 0l.064-.998A8 8 0 0 0 8 0M6.44.152q-.52.104-1.012.27l.321.948q.43-.147.884-.237L6.44.153zm4.132.271a8 8 0 0 0-1.011-.27l-.194.98q.453.09.884.237zm1.873.925a8 8 0 0 0-.906-.524l-.443.896q.413.205.793.459zM4.46.824q-.471.233-.905.524l.556.83a7 7 0 0 1 .793-.458zM2.725 1.985q-.394.346-.74.74l.752.66q.303-.345.648-.648zm11.29.74a8 8 0 0 0-.74-.74l-.66.752q.346.303.648.648zm1.161 1.735a8 8 0 0 0-.524-.905l-.83.556q.254.38.458.793l.896-.443zM1.348 3.555q-.292.433-.524.906l.896.443q.205-.413.459-.793zM.423 5.428a8 8 0 0 0-.27 1.011l.98.194q.09-.453.237-.884zM15.848 6.44a8 8 0 0 0-.27-1.012l-.948.321q.147.43.237.884zM.017 7.477a8 8 0 0 0 0 1.046l.998-.064a7 7 0 0 1 0-.918zM16 8a8 8 0 0 0-.017-.523l-.998.064a7 7 0 0 1 0 .918l.998.064A8 8 0 0 0 16 8M.152 9.56q.104.52.27 1.012l.948-.321a7 7 0 0 1-.237-.884l-.98.194zm15.425 1.012q.168-.493.27-1.011l-.98-.194q-.09.453-.237.884zM.824 11.54a8 8 0 0 0 .524.905l.83-.556a7 7 0 0 1-.458-.793zm13.828.905q.292-.434.524-.906l-.896-.443q-.205.413-.459.793zm-12.667.83q.346.394.74.74l.66-.752a7 7 0 0 1-.648-.648zm11.29.74q.394-.346.74-.74l-.752-.66q-.302.346-.648.648zm-1.735 1.161q.471-.233.905-.524l-.556-.83a7 7 0 0 1-.793.458zm-7.985-.524q.434.292.906.524l.443-.896a7 7 0 0 1-.793-.459zm1.873.925q.493.168 1.011.27l.194-.98a7 7 0 0 1-.884-.237zm4.132.271a8 8 0 0 0 1.012-.27l-.321-.948a7 7 0 0 1-.884.237l.194.98zm-2.083.135a8 8 0 0 0 1.046 0l-.064-.998a7 7 0 0 1-.918 0zM8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"/>
                        </svg>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
