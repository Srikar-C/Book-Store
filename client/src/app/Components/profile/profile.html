<div class="profile absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 border-2 border-black p-6 rounded-lg bg-white w-[400px]">
    <h2 class="text-2xl font-bold mb-4">Fill Details</h2>
    <div class="book-form backdrop-blur-sm bg-white rounded-lg">
        <div class="name mb-4">
            <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
            <input type="text" [(ngModel)]="name" id="name" name="name" required [disabled]="type==2" [class.bg-gray-200]="type==2" class="mt-1 p-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Enter Title of Book">
        </div>
        <div class="email mb-4">
            <label for="email" class="block text-sm font-medium text-gray-700">email</label>
            <input type="text" [(ngModel)]="email" id="email"  name="email" required class="mt-1 p-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Enter Author of Book">
        </div>
        <div class="phone mb-4">
            <label for="phone" class="block text-sm font-medium text-gray-700">phone</label>
            <input type="text" [(ngModel)]="phone" id="phone" name="phone" required class="mt-1 p-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Enter URL of Book">
        </div>
        <div class="password mb-4">
            <label for="password" class="block text-sm font-medium text-gray-700">password</label>
            <input type="password" [(ngModel)]="password" id="password" name="password" required class="mt-1 p-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Enter Price of Book">
        </div>
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 cursor-pointer" (click)="type==1?onSubmit():onEdit()">{{type==1?'Submit':'Edit Book'}}</button>
    </div>
</div>
